events {}

# element-front-test — the player panel, a static Vite bundle (D-008).
#
# The bundle is built with base /element/app/, so Traefik must NOT strip the
# prefix: nginx serves the same path the app asks for. Stripping it would hand
# nginx a bare / and earn a 404 on every asset.
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_name _;

    # SPA fallback: the panel is a BrowserRouter, so a deep link such as
    # /element/app/collection is a client-side route with no file behind it.
    location /element/app/ {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /element/app/index.html;
    }

    location /element/app/assets/ {
      alias /usr/share/nginx/html/element/app/assets/;
      expires 7d;
      access_log off;
      try_files $uri =404;
    }
  }
}
