events {}

# element-editor-front-test — a static Vite bundle, no client-side router
# (single screen, no deep links to fall back for).
#
# Built with base /element/editor/app/, so Traefik must NOT strip the prefix:
# nginx serves the same path the app asks for.
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_name _;

    location /element/editor/app/ {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /element/editor/app/index.html;
    }

    location /element/editor/app/assets/ {
      alias /usr/share/nginx/html/element/editor/app/assets/;
      expires 7d;
      access_log off;
      try_files $uri =404;
    }
  }
}
