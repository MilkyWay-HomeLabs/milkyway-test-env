events {}

# element-game-test — the battle board, a static Vite bundle (D-008).
#
# Built with base /element/game/, so Traefik must NOT strip the prefix. Unlike
# the panel this app has no router: it reads its match from the query string
# (?save=, ?pvp=), which never reaches the filesystem.
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_name _;

    location /element/game/ {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /element/game/index.html;
    }

    location /element/game/assets/ {
      alias /usr/share/nginx/html/element/game/assets/;
      expires 7d;
      access_log off;
      try_files $uri =404;
    }

    # Sprite strips and audio cues are looked up optimistically: no art or audio
    # ships yet, so a miss is normal and the app falls back to a silhouette or
    # silence. Logging every 404 would drown the access log.
    location ~ ^/element/game/(sprites|audio)/ {
      root /usr/share/nginx/html;
      expires 7d;
      access_log off;
      log_not_found off;
      try_files $uri =404;
    }
  }
}
