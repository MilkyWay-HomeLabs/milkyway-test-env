events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_name _;

    location /app/ {
      root /usr/share/nginx/html/nebula;
      index index.html;
      try_files $uri $uri/ /app/index.html;
    }

    # Optional cache for built assets
    location /assets/ {
      alias /usr/share/nginx/html/nebula/app/assets/;
      expires 7d;
      access_log off;
      try_files $uri =404;
    }
  }
}
