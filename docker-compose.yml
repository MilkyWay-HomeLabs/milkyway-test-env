# MilkyWay Home Lab — test environment
#
# Naming convention: <app>-<role>-test, where role is one of rest | front | game
# (see docs/NAMING.md). The compose service key, the container_name and the DNS
# name are all the same string — there is exactly one name to remember per container.
#
# IP allocation (see docs/ARCHITECTURE.md for the full table):
#   .2        traefik
#   .3-.9     infrastructure (monitoring, fileserver, backup)
#   .30-.39   databases
#   .100+     applications, one /10 block each:
#             andromeda .100 | nebula .110 | chess .120 | hacman .130 | robak .140
#             element .150 | racer .160 | puzzel .170   (reserved)
#   Within a block: rest = base+0, front = base+1, game = base+2.
#   A container keeps the same last octet on every network it joins.
#
# Networks and who may talk to whom (enforced by membership, not by convention):
#   proxy     — Traefik and everything it routes to. All HTTP ingress.
#   internal  — databases, monitoring, backup. Backends reach their DB here.
#   auth-net  — ONLY andromeda-auth-test and nebula-rest-test.
#
#   Andromeda is the authorization server. Only Nebula may talk to it. Every other
#   backend authenticates through Nebula, and no front-end talks to a backend
#   directly — fronts go through Traefik. Chess and Robak still hold a direct
#   Andromeda URL in their properties; that is a known deviation, tracked in
#   docs/ARCHITECTURE.md, and it stops working the moment they are recreated
#   without auth-net. Do not recreate them until their app-side change has landed.

services:
  traefik-test:
    image: traefik:v3.2
    container_name: traefik-test
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    networks:
      proxy:
        ipv4_address: 172.21.0.2
      internal:
        ipv4_address: 172.22.0.2
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/config:/config:ro
      - ./traefik/certs:/certs:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - "traefik.enable=true"

  # --- MONITORING ---

  prometheus-test:
    image: prom/prometheus:v3.9.1
    container_name: prometheus-test
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=https://milkyway.test/prometheus/'
    ports:
      - "9090:9090"
    networks:
      internal:
        ipv4_address: 172.22.0.3

  grafana-test:
    image: grafana/grafana:11.4.0
    container_name: grafana-test
    restart: unless-stopped
    env_file:
      - env/grafana/.env
    environment:
      - GF_SERVER_ROOT_URL=https://milkyway.test/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      internal:
        ipv4_address: 172.22.0.4

  node-exporter-test:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter-test
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      internal:
        ipv4_address: 172.22.0.5

  loki-test:
    image: grafana/loki:3.0.0
    container_name: loki-test
    restart: unless-stopped
    command: [ "-config.file=/etc/loki/config.yml" ]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      internal:
        ipv4_address: 172.22.0.6

  promtail-test:
    image: grafana/promtail:3.0.0
    container_name: promtail-test
    restart: unless-stopped
    command: [ "-config.file=/etc/promtail/config.yml" ]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - promtail-positions:/tmp
    networks:
      internal:
        ipv4_address: 172.22.0.7

  # --- SHARED INFRASTRUCTURE ---

  fileserver-test:
    image: nginx:alpine
    container_name: fileserver-test
    restart: unless-stopped
    networks:
      proxy:
        ipv4_address: 172.21.0.8
    volumes:
      - ../../../resources/test:/usr/share/nginx/html:ro
      - ./fileserver-test/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "traefik.enable=false"

  backup-test:
    build: ./backup
    image: milkyway/backup-test:local
    container_name: backup-test
    restart: unless-stopped
    depends_on:
      - mariadb-test
      - postgres-test
      - mongo-test
    volumes:
      - ./backups:/backups
      - ./backups/logs:/var/log/mw-backup
    env_file:
      - ./env/db/mariadb.env
      - ./env/db/postgres.env
      - ./env/db/mongo.env
      - ./env/backup/.env
      - ./env/backup/restic.env
    networks:
      internal:
        ipv4_address: 172.22.0.9

  # --- DATABASES ---
  # Data lives in named volumes (test_mariadb-data, ...), not in this directory.
  # Never run `docker compose down -v` against this project.

  mariadb-test:
    image: mariadb:11
    container_name: mariadb-test
    restart: unless-stopped
    env_file:
      - env/db/mariadb.env
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./sql/mariadb:/docker-entrypoint-initdb.d:ro
    networks:
      internal:
        ipv4_address: 172.22.0.31

  postgres-test:
    image: postgres:16
    container_name: postgres-test
    restart: unless-stopped
    env_file:
      - env/db/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      internal:
        ipv4_address: 172.22.0.32

  mongo-test:
    image: mongo:8
    container_name: mongo-test
    restart: unless-stopped
    env_file:
      - env/db/mongo.env
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./sql/mongo:/docker-entrypoint-initdb.d:ro
    networks:
      internal:
        ipv4_address: 172.22.0.33

  # --- ANDROMEDA (authorization server) ---
  # Deliberately NOT on `proxy`: it has no public route. The only container that
  # can reach it is nebula-rest-test, over auth-net. It stays on `internal` for
  # its MariaDB connection and for Prometheus scraping.

  andromeda-auth-test:
    image: tomcat:10.1-jdk21-temurin
    container_name: andromeda-auth-test
    restart: unless-stopped
    env_file:
      - env/tomcat/.env
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1g
    volumes:
      - ./tomcat/app/andromeda-authorization-server##latest.war:/usr/local/tomcat/webapps/ROOT.war:ro
      - ./tomcat/setenv/andromeda/setenv.sh:/usr/local/tomcat/bin/setenv.sh:ro
      - ./env/tomcat/andromeda-authorization.properties:/usr/local/tomcat/conf/andromeda-authorization.properties:ro
    networks:
      internal:
        ipv4_address: 172.22.0.100
      auth-net:
        ipv4_address: 172.23.0.100
    extra_hosts:
      - "milkyway.test:172.21.0.2"

  # --- NEBULA (SSO gateway: REST + front) ---
  # The only application allowed on auth-net.

  nebula-rest-test:
    image: tomcat:10.1-jdk21-temurin
    container_name: nebula-rest-test
    restart: unless-stopped
    env_file:
      - env/tomcat/.env
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1g
      - IMAGE_AVATAR_PATH=/app/fileserver/nebula/avatars
    volumes:
      - ./tomcat/app/nebula-rest-api##latest.war:/usr/local/tomcat/webapps/ROOT.war:ro
      - ./tomcat/setenv/nebula/setenv.sh:/usr/local/tomcat/bin/setenv.sh:ro
      - ./env/tomcat/nebula-rest.properties:/usr/local/tomcat/conf/nebula-rest.properties:ro
      - ../../../resources/test:/app/fileserver
      - ./traefik/certs/milkyway.crt:/usr/local/share/ca-certificates/milkyway.crt:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.110
      internal:
        ipv4_address: 172.22.0.110
      auth-net:
        ipv4_address: 172.23.0.110
    extra_hosts:
      - "milkyway.test:172.21.0.2"

  nebula-front-test:
    build: ./nginx/nebula-front
    image: milkyway/nebula-front-app-test:local
    container_name: nebula-front-test
    restart: unless-stopped
    env_file:
      - env/nginx/nebula/.env
    networks:
      proxy:
        ipv4_address: 172.21.0.111

  nebula-front-exporter-test:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: nebula-front-exporter-test
    restart: unless-stopped
    command:
      - '-nginx.scrape-uri=http://nebula-front-test:80/nginx_status'
    networks:
      proxy:
        ipv4_address: 172.21.0.11
      internal:
        ipv4_address: 172.22.0.11

  # --- CHESS (rest + front + game) ---

  chess-rest-test:
    image: tomcat:10.1-jdk25-temurin
    container_name: chess-rest-test
    restart: unless-stopped
    env_file:
      - env/tomcat/.env
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1g
      - IMAGE_AVATAR_PATH=/app/fileserver/chess/avatars
    volumes:
      - ./tomcat/app/chess-rest-api##latest.war:/usr/local/tomcat/webapps/ROOT.war:ro
      - ./tomcat/setenv/chess/setenv.sh:/usr/local/tomcat/bin/setenv.sh:ro
      - ./env/tomcat/chess-rest.properties:/usr/local/tomcat/conf/chess-rest.properties:ro
      - ../../../resources/test:/app/fileserver
      - ./traefik/certs/milkyway.crt:/usr/local/share/ca-certificates/milkyway.crt:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.120
      internal:
        ipv4_address: 172.22.0.120
      # TEMPORARY EXCEPTION — violates the "only Nebula talks to Andromeda" rule.
      # Chess REST still calls the authorization server directly
      # (ANDROMEDA_AUTH_SERV_URL in env/tomcat/chess-rest.properties). Removing this
      # one block is all it takes to enforce the rule — but do it only after Chess
      # authenticates through Nebula, otherwise Chess login breaks on next recreate.
      # Tracked in docs/ARCHITECTURE.md § Current deviations.
      auth-net:
        ipv4_address: 172.23.0.120
    extra_hosts:
      - "milkyway.test:172.21.0.2"

  chess-front-test:
    image: nginx:alpine
    container_name: chess-front-test
    restart: unless-stopped
    env_file:
      - env/nginx/chess/.env
    volumes:
      - ./nginx/chess-front/dist:/usr/share/nginx/html/chess/app:ro
      # nginx.conf is a full config (events/http) and must land on /etc/nginx/nginx.conf.
      # The compose file used to point at a django.conf that no longer exists: Docker would
      # have silently created a *directory* in its place, leaving nginx on its stock config
      # with no SPA fallback — every deep link a 404. Same trap as robak-front-test.
      - ./nginx/chess-front/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.121

  chess-game-test:
    build:
      context: django/chess-game/app
      args:
        STOCKFISH_VERSION: sf_18
        STOCKFISH_VARIANT: x86-64-avx2
    image: milkyway/chess-game-front-test:local
    container_name: chess-game-test
    restart: unless-stopped
    env_file:
      - env/django/chess/.env
    networks:
      proxy:
        ipv4_address: 172.21.0.122

  # --- HACMAN (rest + front + game) ---

  hacman-rest-test:
    image: hacman-app-back
    container_name: hacman-rest-test
    build:
      context: kestrel/hacman-app-back
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres-test
    environment:
      - ASPNETCORE_URLS=http://+:8080
    env_file:
      - env/kestrel/hacman/back/.env
    networks:
      proxy:
        ipv4_address: 172.21.0.130
      internal:
        ipv4_address: 172.22.0.130

  hacman-front-test:
    image: hacman-app-front
    container_name: hacman-front-test
    build:
      context: kestrel/hacman-app-front
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - hacman-rest-test
    environment:
      - ASPNETCORE_URLS=http://+:8080
    env_file:
      - env/kestrel/hacman/front/.env
    extra_hosts:
      - "milkyway.test:172.21.0.2"
    networks:
      proxy:
        ipv4_address: 172.21.0.131

  hacman-game-test:
    build: ./nginx/hacman-game
    image: milkyway/hacman-game-app-test:local
    container_name: hacman-game-test
    restart: unless-stopped
    env_file:
      - env/nginx/hacman/.env
    networks:
      proxy:
        ipv4_address: 172.21.0.132

  # --- ROBAK (rest + front + game) ---
  # Enable robak-rest-test once the WAR exists at tomcat/app/robak-rest-api##latest.war.
  # Until then Docker would create a directory in its place and Tomcat would
  # restart-loop; robak-test-svc in traefik answers 502 in the meantime, as expected.
  #
  # robak-rest-test:
  #   image: tomcat:10.1-jdk25-temurin
  #   container_name: robak-rest-test
  #   restart: unless-stopped
  #   env_file:
  #     - env/tomcat/.env
  #   environment:
  #     - JAVA_OPTS=-Xms512m -Xmx1g
  #   volumes:
  #     - ./tomcat/app/robak-rest-api##latest.war:/usr/local/tomcat/webapps/ROOT.war:ro
  #     - ./tomcat/setenv/robak/setenv.sh:/usr/local/tomcat/bin/setenv.sh:ro
  #     - ./env/tomcat/robak-rest.properties:/usr/local/tomcat/conf/robak-rest.properties:ro
  #     - ../../../resources/test:/app/fileserver
  #     - ./traefik/certs/milkyway.crt:/usr/local/share/ca-certificates/milkyway.crt:ro
  #   networks:
  #     proxy:
  #       ipv4_address: 172.21.0.140
  #     internal:
  #       ipv4_address: 172.22.0.140
  #   extra_hosts:
  #     - "milkyway.test:172.21.0.2"

  # The front panel and the board are both static Vite bundles served by stock nginx.
  # nginx.conf is a full config (events/http), so it mounts at /etc/nginx/nginx.conf —
  # anywhere else and nginx silently runs its default config, with no SPA fallback.
  robak-front-test:
    image: nginx:alpine
    container_name: robak-front-test
    restart: unless-stopped
    env_file:
      - env/nginx/robak-front/.env
    volumes:
      - ./nginx/robak-front/dist:/usr/share/nginx/html/robak/app:ro
      - ./nginx/robak-front/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.141

  robak-game-test:
    image: nginx:alpine
    container_name: robak-game-test
    restart: unless-stopped
    env_file:
      - env/nginx/robak-game/.env
    volumes:
      - ./nginx/robak-game/dist:/usr/share/nginx/html/robak/game:ro
      - ./nginx/robak-game/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.142

  # --- ELEMENT (rest + front + game) ---
  #
  # element-rest-api is a Spring Boot 4 fat jar on a plain JRE, not a WAR in the
  # shared Tomcat image every older API uses. That is why this block does not look
  # like the one in docs/future/element-racer-puzzel.yml:
  #   jar/element-rest/           instead of tomcat/app/*.war
  #   env/element/element-rest.env  instead of a *.properties in Tomcat's conf/
  # It also runs on PostgreSQL, not the MariaDB that file assumed (Element D-002).
  #
  # JAVA_OPTS is a Tomcat convention and `java -jar` ignores it, so the heap flags
  # are in the command itself.
  element-rest-test:
    image: eclipse-temurin:25-jre
    container_name: element-rest-test
    restart: unless-stopped
    depends_on:
      - postgres-test
    command: [ "java", "-Xms512m", "-Xmx1g", "-jar", "/app/element-rest-api.jar" ]
    env_file:
      - env/element/element-rest.env
    volumes:
      - ./jar/element-rest/element-rest-api.jar:/app/element-rest-api.jar:ro
      - ../../../resources/test:/app/fileserver
    networks:
      # NO auth-net: the accessToken cookie is validated locally against the
      # shared HS256 secret, so this API never reaches the authorization server.
      proxy:
        ipv4_address: 172.21.0.150
      internal:
        ipv4_address: 172.22.0.150
    extra_hosts:
      - "milkyway.test:172.21.0.2"

  # The panel and the board are both static Vite bundles served by stock nginx.
  # nginx.conf is a full config (events/http), so it mounts at /etc/nginx/nginx.conf —
  # anywhere else and nginx silently runs its default config, with no SPA fallback.
  # Both bundles are built with their own base path, so Traefik does not strip it.
  element-front-test:
    image: nginx:alpine
    container_name: element-front-test
    restart: unless-stopped
    volumes:
      - ./nginx/element-front/dist:/usr/share/nginx/html/element/app:ro
      - ./nginx/element-front/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.151

  element-game-test:
    image: nginx:alpine
    container_name: element-game-test
    restart: unless-stopped
    volumes:
      - ./nginx/element-game/dist:/usr/share/nginx/html/element/game:ro
      - ./nginx/element-game/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.152

  # --- ELEMENT-EDITOR (rest + front) ---
  #
  # A card art/layout generator for Element (docs/element-editor), a separate tool from
  # the element-* trio above — its own repo, its own IP block (.190, next free after Hub's
  # .180), test-environment only, never deployed to prod. No database and no game
  # container: the backend proxies element-rest-api's public catalogue and writes
  # generated art to a bind-mounted volume; the frontend is a static Vite bundle like
  # every other panel here.
  #
  # The backend is a plain Node/TS/Express app (this lab's first — everywhere else is
  # Spring Boot), so it runs the same way element-rest-test's jar does: a generic runtime
  # image plus a bind-mounted build, not a custom Dockerfile. `scripts/deploy-element-editor.sh`
  # builds dist/ + node_modules into node/element-editor-rest/current and swaps it in the
  # same atomic way jar/element-rest/ does.
  #
  # On `internal` to reach element-rest-test directly by container name rather than round-
  # tripping through the public HTTPS route — see ELEMENT_API_URL in
  # env/element-editor/element-editor-rest.env. NO auth-net: this tool never authenticates
  # against anything: the catalogue it reads is public (element-rest-api PR #22) and it
  # has no login flow of its own.
  element-editor-rest-test:
    image: node:22-slim
    container_name: element-editor-rest-test
    restart: unless-stopped
    depends_on:
      - element-rest-test
    command: [ "node", "dist/server.js" ]
    working_dir: /app
    env_file:
      - env/element-editor/element-editor-rest.env
    volumes:
      - ./node/element-editor-rest/current:/app:ro
      - ../../../resources/test/element-editor:/app/output
    networks:
      proxy:
        ipv4_address: 172.21.0.190
      internal:
        ipv4_address: 172.22.0.190

  element-editor-front-test:
    image: nginx:alpine
    container_name: element-editor-front-test
    restart: unless-stopped
    volumes:
      - ./nginx/element-editor-front/dist:/usr/share/nginx/html/element/editor/app:ro
      - ./nginx/element-editor-front/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.191

  # --- RACER (rest + front + game) ---
  # All three are commented out: none of racer-rest-api's WAR, racer-front's dist or
  # racer-game's dist exist on disk yet. Docker would create a directory where each file
  # should be and Tomcat would restart-loop the same way robak-rest-test does above;
  # uncomment each service individually once its artifact lands, following
  # docs/future/ADDING-AN-APP.md. Traefik's racer-*-test routers already exist in
  # traefik/config/dynamic.yml and answer 502 in the meantime, as expected.
  #
  # racer-rest-test:
  #   image: tomcat:10.1-jdk25-temurin
  #   container_name: racer-rest-test
  #   restart: unless-stopped
  #   env_file:
  #     - env/tomcat/.env
  #   environment:
  #     - JAVA_OPTS=-Xms512m -Xmx1g
  #   volumes:
  #     - ./tomcat/app/racer-rest-api##latest.war:/usr/local/tomcat/webapps/ROOT.war:ro
  #     - ./tomcat/setenv/racer/setenv.sh:/usr/local/tomcat/bin/setenv.sh:ro
  #     - ./env/tomcat/racer-rest.properties:/usr/local/tomcat/conf/racer-rest.properties:ro
  #     - ../../../resources/test:/app/fileserver
  #     - ./traefik/certs/milkyway.crt:/usr/local/share/ca-certificates/milkyway.crt:ro
  #   networks:
  #     proxy:
  #       ipv4_address: 172.21.0.160
  #     internal:
  #       ipv4_address: 172.22.0.160
  #   extra_hosts:
  #     - "milkyway.test:172.21.0.2"
  #
  # racer-front-test:
  #   image: nginx:alpine
  #   container_name: racer-front-test
  #   restart: unless-stopped
  #   env_file:
  #     - env/nginx/racer-front/.env
  #   volumes:
  #     - ./nginx/racer-front/dist:/usr/share/nginx/html/racer/app:ro
  #     - ./nginx/racer-front/nginx.conf:/etc/nginx/nginx.conf:ro
  #   networks:
  #     proxy:
  #       ipv4_address: 172.21.0.161
  #
  # racer-game-test:
  #   image: nginx:alpine
  #   container_name: racer-game-test
  #   restart: unless-stopped
  #   env_file:
  #     - env/nginx/racer-game/.env
  #   volumes:
  #     - ./nginx/racer-game/dist:/usr/share/nginx/html/racer/game:ro
  #     - ./nginx/racer-game/nginx.conf:/etc/nginx/nginx.conf:ro
  #   networks:
  #     proxy:
  #       ipv4_address: 172.21.0.162

  # --- FUTURE APPS ---
  # puzzel (.170) gets rest + front + game. MongoDB already holds test_puzzel. See
  # docs/future/ADDING-AN-APP.md for the full checklist and
  # docs/future/element-racer-puzzel.yml for ready-to-paste service blocks.

  # --- HUB (rest + front) ---
  #
  # MilkyWayHub, the system of record for this lab: environments, databases, applications
  # and the work queued against each. Read-only against everything it observes (CON-5).
  # It takes the next free application block, .180, after puzzel .170 — rest = base+0,
  # front = base+1; a hub-game-test would be .182 and will not exist.
  #
  # Unlike every other application here, both images are built from source in another
  # repository rather than from a jar, a war or a dist/ dropped into this one. `image:`
  # names what the build produces so that `docker compose up` without `--build` runs the
  # last thing built rather than trying to pull a tag that was never pushed anywhere.
  # Source, and the four fragments this block came from: repo/dev/milkyway-hub/deploy/.
  hub-rest-test:
    build:
      context: ../../../repo/dev/milkyway-hub/backend
    image: milkyway/hub-rest-test:local
    container_name: hub-rest-test
    restart: unless-stopped
    env_file:
      - env/hub/hub.env
    volumes:
      # A named volume, not a bind mount: it survives container recreation and image
      # rebuild, and the only copy of the inventory never sits in a working tree where an
      # accidental `git add` would publish every endpoint in the lab.
      - hub-data:/data
      # Read-only, and not a formality — it is what makes "the Hub never writes to
      # anything" true regardless of what the code does. Both mounts are here although the
      # Git probe that reads them is v0.4: adding a mount later means recreating a running
      # container, and the mounts cost nothing empty.
      - /home/wolf/MilkyWayHomeLab/repo:/repos:ro
      - /home/wolf/MilkyWayHomeLab/infrastructure/docker/test:/envs/test:ro
      # prod's *checkout*, not prod: a directory on this host, :ro like the other two.
      # The seed watches every repository with a local_path and milkyway-prod-env is one,
      # so without this mount that target is stale for ever and /health says degraded for
      # a reason nobody can fix from the Hub.
      - /home/wolf/MilkyWayHomeLab/infrastructure/docker/prod:/envs/prod:ro
    networks:
      # NO auth-net. The Hub is not part of the authorization path and must never be —
      # it is an index of the lab, not a participant in it.
      #
      # `internal` carries no traffic yet; it is what the Docker and Prometheus probes
      # need to reach prometheus-test and docker-proxy-test, and joining it now costs
      # nothing while joining it later costs a recreate.
      proxy:
        ipv4_address: 172.21.0.180
      internal:
        ipv4_address: 172.22.0.180

  hub-front-test:
    build:
      # The repository root, not frontend/ — the image also copies deploy/nginx.conf.
      # That is why this front end mounts no nginx.conf from nginx/, unlike every other
      # one here: it is baked into the image.
      context: ../../../repo/dev/milkyway-hub
      dockerfile: frontend/Dockerfile
    image: milkyway/hub-front-test:local
    container_name: hub-front-test
    restart: unless-stopped
    networks:
      # proxy only, like every other front end here. A front end on `internal` is a bug:
      # it has no business reaching a database.
      proxy:
        ipv4_address: 172.21.0.181

  # docker-proxy-test is infrastructure, not part of the Hub — a read-only view of the
  # Docker API any future tool can use, named <component>-test exactly like
  # node-exporter-test. Its first consumer is the Hub's Docker probe (v0.5, FR-6.2).
  #
  # It takes .10, continuing the infrastructure range into the unallocated .10-.19 because
  # .3-.9 is full. docs/ARCHITECTURE.md says so as of 2026-08-09.
  docker-proxy-test:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-proxy-test
    restart: unless-stopped
    environment:
      # CONTAINERS=1 and nothing else: no POST, no exec, no images, no volumes. Nothing in
      # this environment is allowed to write to the daemon, and this is what enforces it
      # rather than what asks for it.
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      internal:                # internal only — it is never routed by Traefik
        ipv4_address: 172.22.0.10

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  promtail-positions:
    driver: local
  mariadb-data:
    driver: local
  postgres-data:
    driver: local
  mongo-data:
    driver: local
  # The Hub's SQLite database and its nightly backups, at /data in hub-rest-test.
  hub-data:
    driver: local

networks:
  proxy:
    name: proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  internal:
    name: internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  # Andromeda + Nebula only. Membership IS the access control: a container that
  # is not on this network has no route to the authorization server.
  auth-net:
    name: auth-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.23.0.0/24
