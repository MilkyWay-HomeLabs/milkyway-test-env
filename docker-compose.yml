services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    networks:
      proxy:
        ipv4_address: 172.21.0.2
      internal:
        ipv4_address: 172.22.0.2
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/config:/config:ro
      - ./traefik/certs:/certs:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - "traefik.enable=true"
  #      - "traefik.http.routers.dashboard.rule=Host(`milkyway.test`) && PathPrefix(`/traefik`)"
  #      - "traefik.http.routers.dashboard.entrypoints=https"
  #      - "traefik.http.routers.dashboard.tls=true"
  #      - "traefik.http.routers.dashboard.service=api@internal"
  #      - "traefik.http.routers.dashboard.middlewares=auth,strip-traefik"
  #      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
  #      - "traefik.http.middlewares.strip-traefik.stripprefix.prefixes=/traefik"

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=https://milkyway.test/prometheus/'
    ports:
      - "9090:9090"
    networks:
      internal:
        ipv4_address: 172.22.0.3

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    env_file:
      - env/grafana/.env
    environment:
      - GF_SERVER_ROOT_URL=https://milkyway.test/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      internal:
        ipv4_address: 172.22.0.4

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      internal:
        ipv4_address: 172.22.0.5

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    command: [ "-config.file=/etc/loki/config.yml" ]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      internal:
        ipv4_address: 172.22.0.6

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    command: [ "-config.file=/etc/promtail/config.yml" ]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - promtail-positions:/tmp
    networks:
      internal:
        ipv4_address: 172.22.0.7

  fileserver-test:
    image: nginx:alpine
    container_name: fileserver-test
    restart: unless-stopped
    networks:
      proxy:
        ipv4_address: 172.21.0.8
    volumes:
      - ../../../resources/test:/usr/share/nginx/html:ro
      - ./fileserver-test/django.conf:/etc/nginx/django.conf:ro
    labels:
      - "traefik.enable=false"

  backup-test:
    build: ./backup
    image: milkyway/backup-test:local
    container_name: backup-test
    restart: unless-stopped
    depends_on:
      - mariadb-test
      - postgres-test
      - mongo-test
    volumes:
      - ./backups:/backups
      - ./backups/logs:/var/log/mw-backup
    env_file:
      - ./env/db/mariadb.env
      - ./env/db/postgres.env
      - ./env/db/mongo.env
      - ./env/backup/.env
      - ./env/backup/restic.env
    networks:
      internal:
        ipv4_address: 172.22.0.9

  mariadb-test:
    image: mariadb:11
    container_name: milky-test-mariadb
    restart: unless-stopped
    env_file:
      - env/db/mariadb.env
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./sql/mariadb:/docker-entrypoint-initdb.d:ro
    networks:
      internal:
        ipv4_address: 172.22.0.31

  postgres-test:
    image: postgres:16
    container_name: milky-test-postgres
    restart: unless-stopped
    env_file:
      - env/db/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      internal:
        ipv4_address: 172.22.0.32

  mongo-test:
    image: mongo:8
    container_name: milky-test-mongo
    restart: unless-stopped
    env_file:
      - env/db/mongo.env
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./sql/mongo:/docker-entrypoint-initdb.d:ro
    networks:
      internal:
        ipv4_address: 172.22.0.33

  tomcat-test-andromeda:
    image: tomcat:10.1-jdk21-temurin
    container_name: tomcat-test-andromeda
    restart: unless-stopped
    env_file:
      - env/tomcat/.env
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1g
    volumes:
      - ./tomcat/app/andromeda-authorization-server##latest.war:/usr/local/tomcat/webapps/ROOT.war:ro
      - ./tomcat/setenv/andromeda/setenv.sh:/usr/local/tomcat/bin/setenv.sh:ro
      - ./env/tomcat/andromeda-authorization.properties:/usr/local/tomcat/conf/andromeda-authorization.properties:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.11
      internal:
        ipv4_address: 172.22.0.11
    extra_hosts:
      - "milkyway.test:172.21.0.2"

  tomcat-test-nebula:
    image: tomcat:10.1-jdk21-temurin
    container_name: tomcat-test-nebula
    restart: unless-stopped
    env_file:
      - env/tomcat/.env
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1g
      - IMAGE_AVATAR_PATH=/app/fileserver/nebula/avatars
    volumes:
      - ./tomcat/app/nebula-rest-api##latest.war:/usr/local/tomcat/webapps/ROOT.war:ro
      - ./tomcat/setenv/nebula/setenv.sh:/usr/local/tomcat/bin/setenv.sh:ro
      - ./env/tomcat/nebula-rest.properties:/usr/local/tomcat/conf/nebula-rest.properties:ro
      - ../../../resources/test:/app/fileserver
      - ./traefik/certs/milkyway.crt:/usr/local/share/ca-certificates/milkyway.crt:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.12
      internal:
        ipv4_address: 172.22.0.12
    extra_hosts:
      - "milkyway.test:172.21.0.2"

  nebula-front-app-test:
    build: ./nginx/nebula-front-app
    image: milkyway/nebula-front-app-test:local
    container_name: nebula-front-app-test
    restart: unless-stopped
    env_file:
      - env/nginx/nebula/.env
    networks:
      proxy:
        ipv4_address: 172.21.0.42

  hacman-app-back:
    image: hacman-app-back
    container_name: hacman-app-back-test
    build:
      context: kestrel/hacman-app-back
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres-test
    environment:
      - ASPNETCORE_URLS=http://+:8080
    env_file:
      - env/kestrel/hacman/back/.env
    networks:
      proxy:
        ipv4_address: 172.21.0.13
      internal:
        ipv4_address: 172.22.0.13

  hacman-app-front:
    image: hacman-app-front
    container_name: hacman-app-front-test
    build:
      context: kestrel/hacman-app-front
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - hacman-app-back
    environment:
      - ASPNETCORE_URLS=http://+:8080
    env_file:
      - env/kestrel/hacman/front/.env
    extra_hosts:
      - "milkyway.test:172.21.0.2"
    networks:
      proxy:
        ipv4_address: 172.21.0.43

  hacman-game-front:
    build: ./nginx/hacman-game-app
    image: milkyway/hacman-game-app-test:local
    container_name: hacman-game-app-test
    restart: unless-stopped
    env_file:
      - env/nginx/hacman/.env
    networks:
      proxy:
        ipv4_address: 172.21.0.44

  tomcat-test-chess:
    image: tomcat:10.1-jdk25-temurin
    container_name: tomcat-test-chess
    restart: unless-stopped
    env_file:
      - env/tomcat/.env
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1g
      - IMAGE_AVATAR_PATH=/app/fileserver/chess/avatars
    volumes:
      - ./tomcat/app/chess-rest-api##latest.war:/usr/local/tomcat/webapps/ROOT.war:ro
      - ./tomcat/setenv/chess/setenv.sh:/usr/local/tomcat/bin/setenv.sh:ro
      - ./env/tomcat/chess-rest.properties:/usr/local/tomcat/conf/chess-rest.properties:ro
      - ../../../resources/test:/app/fileserver
      - ./traefik/certs/milkyway.crt:/usr/local/share/ca-certificates/milkyway.crt:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.14
      internal:
        ipv4_address: 172.22.0.14
    extra_hosts:
      - "milkyway.test:172.21.0.2"

  chess-front-app-test:
    image: nginx:alpine
    container_name: chess-front-app-test
    restart: unless-stopped
    env_file:
      - env/nginx/chess/.env
    volumes:
      - ./nginx/chess-front-app/dist:/usr/share/nginx/html/chess/app:ro
      - ./nginx/chess-front-app/django.conf:/etc/nginx/django.conf:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.45

  chess-game-front:
    build:
      context: django/chess-game-front
      args:
        STOCKFISH_VERSION: sf_18
        STOCKFISH_VARIANT: x86-64-avx2
    image: milkyway/chess-game-front-test:local
    container_name: chess-game-front-test
    restart: unless-stopped
    env_file:
      - env/django/chess/.env
    networks:
      proxy:
        ipv4_address: 172.21.0.46

  tomcat-test-robak:
    image: tomcat:10.1-jdk25-temurin
    container_name: tomcat-test-robak-front
    restart: unless-stopped
    env_file:
      - env/tomcat/.env
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1g
      - IMAGE_AVATAR_PATH=/app/fileserver/robak-front/avatars
    volumes:
      - ./tomcat/app/robak-front-rest-api##latest.war:/usr/local/tomcat/webapps/ROOT.war:ro
      - ./tomcat/setenv/robak-front/setenv.sh:/usr/local/tomcat/bin/setenv.sh:ro
      - ./env/tomcat/robak-front-rest.properties:/usr/local/tomcat/conf/robak-front-rest.properties:ro
      - ../../../resources/test:/app/fileserver
      - ./traefik/certs/milkyway.crt:/usr/local/share/ca-certificates/milkyway.crt:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.15
      internal:
        ipv4_address: 172.22.0.15
    extra_hosts:
      - "milkyway.test:172.21.0.2"

  robak-front-app-test:
    image: nginx:alpine
    container_name: robak-front-app-test
    restart: unless-stopped
    env_file:
      - env/nginx/robak-front/.env
    volumes:
      - ./nginx/robak-front-app/dist:/usr/share/nginx/html/robak/app:ro
      - ./nginx/robak-front-app/django.conf:/etc/nginx/django.conf:ro
    networks:
      proxy:
        ipv4_address: 172.21.0.47

  robak-game-app-test:
    build:
      context: django/robak-game-app-test
      args:
        STOCKFISH_VERSION: sf_18
        STOCKFISH_VARIANT: x86-64-avx2
    image: milkyway/robak-game-app-test:local
    container_name: robak-game-app-test
    restart: unless-stopped
    env_file:
      - env/django/robak-game/.env
    networks:
      proxy:
        ipv4_address: 172.21.0.48

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  promtail-positions:
    driver: local
  mariadb-data:
    driver: local
  postgres-data:
    driver: local
  mongo-data:
    driver: local

networks:
  proxy:
    name: proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  internal:
    name: internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
