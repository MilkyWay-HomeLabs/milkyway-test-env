global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Targets use the <app>-<role>-test container names (see docs/NAMING.md).
# Prometheus scrapes over the `internal` network, so every target below must be
# a member of it — that is why the fronts and games (proxy-only) are not scraped.

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'prometheus-test:9090' ]

  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'node-exporter-test:9100' ]

  - job_name: 'andromeda-auth'
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: [ 'andromeda-auth-test:8080' ]

  - job_name: 'nebula-rest'
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: [ 'nebula-rest-test:8080' ]

  - job_name: 'nebula-front'
    static_configs:
      - targets: [ 'nebula-front-exporter-test:9113' ]

  - job_name: 'hacman-rest'
    static_configs:
      - targets: [ 'hacman-rest-test:8080' ]

  # hacman-front-test lives on `proxy` only and is unreachable from Prometheus on
  # `internal`. Scraping it would need a second network membership; left out until
  # its metrics are actually wanted.

  # MilkyWayHub, the system of record for this lab. No `metrics_path`: it answers on the
  # standard /metrics. Scraped container-to-container on `internal` like everything else
  # here — through Traefik a scrape would depend on the router, the certificate and the
  # strip-hub middleware, and each of those failing would read as the Hub being down.
  #
  # hub-front-test is not scraped, for the same reason hacman-front-test is not: proxy
  # only, and static files.
  #
  # What it publishes is the Hub's own health as numbers — hub_backup_age_seconds,
  # hub_probe_state, hub_database_reachable — which is the one question the Hub cannot
  # answer about itself. Source of this block: repo/dev/milkyway-hub/deploy/prometheus.hub.yml.
  - job_name: 'hub-rest'
    static_configs:
      - targets: [ 'hub-rest-test:8000' ]

  # racer-rest-test does not exist yet (no WAR) — this target is unreachable and the
  # job shows as `down` until docker-compose.yml's racer-rest-test is uncommented.
  # racer-front-test and racer-game-test stay unscraped for the same reason as every
  # other front/game: proxy-only, unreachable from `internal`.
  - job_name: 'racer-rest-test'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'racer-rest-test:8080' ]
