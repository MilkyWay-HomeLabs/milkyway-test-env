global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'tomcat-test-andromeda'
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ['tomcat-test-andromeda:8080']

  - job_name: 'hacman-app-back'
    static_configs:
      - targets: [ 'hacman-app-back-test:8080' ]
  - job_name: 'hacman-app-front'
    static_configs:
      - targets: [ 'hacman-app-front-test:8080' ]
