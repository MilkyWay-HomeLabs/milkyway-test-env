tls:
  certificates:
    - certFile: /certs/milkyway.crt
      keyFile: /certs/milkyway.key

http:
  routers:
    # --- INFRASTRUCTURE ---
    dashboard:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dashboard`)"
      entryPoints:
        - https
      service: api@internal
      tls: { }

    dashboard-api:
      rule: "Host(`milkyway.test`) && PathPrefix(`/api`)"
      entryPoints:
        - https
      service: api@internal
      tls: { }

    prometheus:
      rule: "Host(`milkyway.test`) && PathPrefix(`/prometheus`)"
      entryPoints: [ "https" ]
      service: "prometheus-svc"
      # Requires --web.external-url=https://milkyway.test/prometheus/ flag in Prometheus
      tls: { }

    grafana:
      rule: "Host(`milkyway.test`) && PathPrefix(`/grafana`)"
      entryPoints: [ "https" ]
      service: "grafana-svc"
      # Requires GF_SERVER_ROOT_URL=https://milkyway.test/grafana/ in Grafana environment
      tls: { }

    resources:
      rule: "Host(`milkyway.test`) && PathPrefix(`/resources`)"
      entryPoints: [ "https" ]
      service: "resources-svc"
      middlewares: [ "strip-resources" ]
      tls: { }

    # --- HUB (TEST) ---
    #
    # `/hub/app/` is not stripped: the bundle is built with that base
    # (frontend/vite.config.ts in the hub repository) and nginx serves that very path, so
    # stripping would hand nginx a bare "/" and earn a 404 — the same rule as
    # robak-front-test and element-front-test.
    #
    # `/hub/api` *is* stripped, and that is the one asymmetry in this block. The backend
    # runs with root_path="/hub", so it routes on /api/v1/... and still writes /hub into
    # the OpenAPI document's server URL. Strip and root_path are two halves of one
    # decision: remove either and the interactive docs generate a client that calls the
    # wrong URL.
    hub-front-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/hub/app/`)"
      entryPoints: [ "https" ]
      service: "hub-front-test-svc"
      priority: 100
      tls: { }

    hub-api-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/hub/api`)"
      entryPoints: [ "https" ]
      service: "hub-rest-test-svc"
      middlewares: [ "strip-hub" ]
      priority: 150
      tls: { }

    # FastAPI serves the interactive docs and the schema off the application root, so they
    # arrive on the same service through the same strip. Separate from the API router
    # because they are separate paths, not because they are configured differently.
    hub-docs-test:
      rule: "Host(`milkyway.test`) && (PathPrefix(`/hub/docs`) || PathPrefix(`/hub/openapi.json`))"
      entryPoints: [ "https" ]
      service: "hub-rest-test-svc"
      middlewares: [ "strip-hub" ]
      tls: { }

    # --- ELEMENT APP (TEST) ---
    # No strip anywhere in this block, which makes it the odd one out.
    #
    # The two nginx routers are the usual case: both bundles are built with a base
    # of /element/app/ and /element/game/ and their nginx.conf serves those paths,
    # so stripping would hand nginx a bare "/" and earn a 404.
    #
    # The API is the unusual one. element-rest-api runs with the context path
    # /element/api (application.yml), so it expects to see the prefix it is
    # reached by — unlike Robak and Chess, which are deployed at the container
    # root and therefore need strip-<app>. Adding a strip here would hand it
    # /v1/... and earn a 404 on every call.
    element-game-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/element/game/`)"
      entryPoints: [ "https" ]
      service: "element-game-test-svc"
      tls: { }

    element-front-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/element/app/`)"
      entryPoints: [ "https" ]
      service: "element-front-test-svc"
      priority: 100
      tls: { }

    # The curated contract at openapi/openapi.yaml is the source of truth and the
    # UI is pointed at it, so both live under the API's own context path — no
    # separate swagger router is needed the way Robak has one.
    element-api-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/element/api`)"
      entryPoints: [ "https" ]
      service: "element-test-svc"
      priority: 150
      tls: { }

    # --- ELEMENT-EDITOR (TEST) ---
    # A separate tool from the element-* trio above (docs/element-editor); no strip on
    # either router, same reasoning as Element's own: the front bundle is built with base
    # /element/editor/app/ and nginx serves that path, and the backend mounts everything
    # under its own context path /element/editor/api (matching element-rest-api's
    # convention), so it expects to see the prefix it is reached by.
    element-editor-front-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/element/editor/app/`)"
      entryPoints: [ "https" ]
      service: "element-editor-front-test-svc"
      priority: 100
      tls: { }

    element-editor-api-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/element/editor/api`)"
      entryPoints: [ "https" ]
      service: "element-editor-test-svc"
      priority: 150
      tls: { }

    # --- ROBAK APP (TEST) ---
    # No strip on the two nginx routers: both bundles are built with a base of
    # /robak/app/ and /robak/game/, and their nginx.conf serves those very paths.
    # Stripping the prefix would hand nginx a bare "/" and earn a 404.
    robak-game-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/robak/game/`)"
      entryPoints: [ "https" ]
      service: "robak-game-test-svc"
      tls: { }

    robak-front-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/robak/app/`)"
      entryPoints: [ "https" ]
      service: "robak-front-test-svc"
      priority: 100
      tls: { }

    robak-swagger-test:
      rule: "Host(`milkyway.test`) && (PathPrefix(`/robak/swagger-ui`) || PathPrefix(`/robak/v3/api-docs`))"
      entryPoints: [ "https" ]
      service: "robak-test-svc"
      middlewares: [ "strip-robak" ]
      tls: { }

    robak-api-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/robak/api`)"
      entryPoints: [ "https" ]
      service: "robak-test-svc"
      middlewares: [ "strip-robak" ]
      priority: 150
      tls: { }

    # --- RACER APP (TEST) ---
    # racer-rest-test does not exist yet (no WAR) — these routers resolve to nothing
    # and answer 502 until P3-2 in docker-compose.yml is uncommented, which is expected,
    # not a bug (see docs/future/ADDING-AN-APP.md).
    #
    # No strip on the two nginx routers: both bundles are built with a base of
    # /racer/app/ and /racer/game/, and their nginx.conf serves those very paths.
    # Stripping the prefix would hand nginx a bare "/" and earn a 404.
    racer-game-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/racer/game/`)"
      entryPoints: [ "https" ]
      service: "racer-game-test-svc"
      tls: { }

    racer-front-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/racer/app/`)"
      entryPoints: [ "https" ]
      service: "racer-front-test-svc"
      priority: 100
      tls: { }

    racer-swagger-test:
      rule: "Host(`milkyway.test`) && (PathPrefix(`/racer/swagger-ui`) || PathPrefix(`/racer/v3/api-docs`))"
      entryPoints: [ "https" ]
      service: "racer-test-svc"
      middlewares: [ "strip-racer" ]
      tls: { }

    racer-api-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/racer/api`)"
      entryPoints: [ "https" ]
      service: "racer-test-svc"
      middlewares: [ "strip-racer" ]
      priority: 150
      tls: { }

    # --- CHESS APP (TEST) ---
    chess-game-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/chess/game/`)"
      entryPoints: [ "https" ]
      service: "chess-game-test-svc"
      middlewares: [ "strip-chess-game-test" ]
      tls: { }

    chess-front-test-static:
      rule: "Host(`milkyway.test`) && (PathPrefix(`/chess/app/lib/`) || PathPrefix(`/chess/app/css/`) || PathPrefix(`/chess/app/js/`) || PathPrefix(`/chess/app/_framework/`) || PathPrefix(`/chess/app/app.`) || PathPrefix(`/chess/app/hacman-app-front.`) || Path(`/chess/app/favicon.png`))"
      entryPoints: [ "https" ]
      service: "chess-front-test-svc"
      priority: 200
      tls: { }

    chess-front-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/chess/app/`)"
      entryPoints: [ "https" ]
      service: "chess-front-test-svc"
      priority: 100
      tls: { }

    chess-swagger-test:
      rule: "Host(`milkyway.test`) && (PathPrefix(`/chess/swagger-ui`) || PathPrefix(`/chess/v3/api-docs`))"
      entryPoints: [ "https" ]
      service: "chess-test-svc"
      #      middlewares: ["strip-nebula"]
      tls: { }

    chess-api-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/chess/api`)"
      entryPoints: [ "https" ]
      service: "chess-test-svc"
      middlewares: [ "strip-chess" ]
      priority: 150
      tls: { }

    # --- HACMAN APP (TEST) ---
    hacman-game-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/hacman/game/`)"
      entryPoints: [ "https" ]
      service: "hacman-game-test-svc"
      #      middlewares: [ "strip-hacman-game-test" ]
      tls: { }

    hacman-front-test-static:
      rule: "Host(`milkyway.test`) && (PathPrefix(`/hacman/app/lib/`) || PathPrefix(`/hacman/app/css/`) || PathPrefix(`/hacman/app/js/`) || PathPrefix(`/hacman/app/_framework/`) || PathPrefix(`/hacman/app/app.`) || PathPrefix(`/hacman/app/hacman-app-front.`) || Path(`/hacman/app/favicon.png`))"
      entryPoints: [ "https" ]
      service: "hacman-front-test-svc"
      priority: 200
      tls: { }

    hacman-front-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/hacman/app/`)"
      entryPoints: [ "https" ]
      service: "hacman-front-test-svc"
      priority: 100
      tls: { }

    hacman-api-test:
      rule: "Host(`milkyway.test`) && (PathPrefix(`/hacman/api`) || PathPrefix(`/hacman/swagger`))"
      entryPoints: [ "https" ]
      service: "hacman-test-svc"
      middlewares: [ "strip-hacman" ]
      priority: 150
      tls: { }

    # --- NEBULA APP (TEST) ---
    nebula-front-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/nebula/app/`)"
      entryPoints: [ "https" ]
      service: "nebula-front-test-svc"
      # IMPORTANT: If Nebula Frontend is React/Vite, use base: "/nebula/"
      tls: { }

    nebula-swagger-test:
      rule: "Host(`milkyway.test`) && (PathPrefix(`/nebula/swagger-ui`) || PathPrefix(`/nebula/v3/api-docs`))"
      entryPoints: [ "https" ]
      service: "nebula-test-svc"
      #      middlewares: ["strip-nebula"]
      tls: { }

    nebula-api-test:
      rule: "Host(`milkyway.test`) && PathPrefix(`/nebula/api`)"
      entryPoints: [ "https" ]
      service: "nebula-test-svc"
      middlewares: [ "strip-nebula" ]
      tls: { }

    # --- ANDROMEDA APP (TEST) ---
    # NO PUBLIC ROUTER, on purpose. Andromeda is the authorization server; only Nebula
    # may reach it, over auth-net. A browser has no business talking to it directly.
    #
    # Taking Andromeda off the `proxy` network was NOT enough to close this: Traefik is
    # also on `internal`, where Andromeda still lives for its database, so the router
    # below kept resolving and /andromeda answered 401 — reachable, just unauthenticated.
    # Deleting the router is what actually closes the door.
    #
    # andromeda-api-test:
    #   rule: "Host(`milkyway.test`) && PathPrefix(`/andromeda`)"
    #   entryPoints: [ "https" ]
    #   service: "andromeda-test-svc"
    #   middlewares: [ "strip-andromeda" ]
    #   tls: { }

    # --- DEVELOPMENT ENVIRONMENT ---

    robak-game-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/robak/game/`)"
      entryPoints: [ "https" ]
      service: "robak-game-dev-svc"
      middlewares: [ "strip-robak-game-dev" ]
      tls: { }

    robak-front-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/robak/app`)"
      entryPoints: [ "https" ]
      service: "robak-front-dev-svc"
      tls: { }

    robak-api-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/robak/api`)"
      entryPoints: [ "https" ]
      service: "robak-dev-svc"
      middlewares: [ "strip-robak-dev" ]
      tls: { }

    racer-game-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/racer/game/`)"
      entryPoints: [ "https" ]
      service: "racer-game-dev-svc"
      middlewares: [ "strip-racer-game-dev" ]
      tls: { }

    racer-front-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/racer/app`)"
      entryPoints: [ "https" ]
      service: "racer-front-dev-svc"
      tls: { }

    racer-api-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/racer/api`)"
      entryPoints: [ "https" ]
      service: "racer-dev-svc"
      middlewares: [ "strip-racer-dev" ]
      tls: { }

    element-front-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/element/app`)"
      entryPoints: [ "https" ]
      service: "element-front-dev-svc"
      tls: { }

    element-game-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/element/game`)"
      entryPoints: [ "https" ]
      service: "element-game-dev-svc"
      tls: { }

    # Only /dev is stripped: element-rest-api runs with the context path
    # /element/api, so the app expects to see it. Stripping /dev/element as the
    # other APIs do would hand it /api/... and earn a 404 on every call.
    element-api-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/element/api`)"
      entryPoints: [ "https" ]
      service: "element-dev-svc"
      middlewares: [ "strip-element-dev" ]
      tls: { }

    # Vite's HMR socket lives at the host root, so the two dev servers are given
    # distinct paths rather than fighting over one /@vite-hmr.
    element-front-hmr-dev:
      rule: "Host(`milkyway.test`) && Path(`/@vite-hmr-element-app`)"
      entryPoints: [ "https" ]
      service: "element-front-dev-svc"
      tls: { }

    element-game-hmr-dev:
      rule: "Host(`milkyway.test`) && Path(`/@vite-hmr-element-game`)"
      entryPoints: [ "https" ]
      service: "element-game-dev-svc"
      tls: { }

    chess-game-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/chess/game/`)"
      entryPoints: [ "https" ]
      service: "chess-game-dev-svc"
      middlewares: [ "strip-chess-game-dev" ]
      tls: { }

    chess-front-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/chess/app`)"
      entryPoints: [ "https" ]
      service: "chess-front-dev-svc"
      tls: { }

    chess-api-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/chess/api`)"
      entryPoints: [ "https" ]
      service: "chess-dev-svc"
      middlewares: [ "strip-chess-dev" ]
      tls: { }

    hacman-game-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/hacman/game/`)"
      entryPoints: [ "https" ]
      service: "hacman-game-dev-svc"
      #      middlewares: [ "strip-hacman-game-dev" ]
      tls: { }

    hacman-front-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/hacman/app`)"
      entryPoints: [ "https" ]
      service: "hacman-front-dev-svc"
      tls: { }

    hacman-api-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/hacman/api`)"
      entryPoints: [ "https" ]
      service: "hacman-dev-svc"
      middlewares: [ "strip-hacman-dev" ]
      tls: { }

    nebula-front-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/nebula/app/`)"
      entryPoints: [ "https" ]
      service: "nebula-front-dev-svc"
      tls: { }

    nebula-api-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/nebula/api`)"
      entryPoints: [ "https" ]
      service: "nebula-dev-svc"
      middlewares: [ "strip-nebula-dev" ]
      tls: { }

    andromeda-api-dev:
      rule: "Host(`milkyway.test`) && PathPrefix(`/dev/andromeda/api`)"
      entryPoints: [ "https" ]
      service: "andromeda-dev-svc"
      middlewares: [ "strip-andromeda-dev" ]
      tls: { }

  services:
    resources-svc:
      loadBalancer:
        servers: [ { url: "http://fileserver-test:80" } ]
    prometheus-svc:
      loadBalancer:
        servers: [ { url: "http://prometheus-test:9090" } ]
    grafana-svc:
      loadBalancer:
        servers: [ { url: "http://grafana-test:3000" } ]
    # andromeda-test-svc intentionally removed — see the router comment above.
    nebula-test-svc:
      loadBalancer:
        servers: [ { url: "http://nebula-rest-test:8080" } ]
    nebula-front-test-svc:
      loadBalancer:
        servers: [ { url: "http://nebula-front-test:80" } ]
    chess-test-svc:
      loadBalancer:
        servers: [ { url: "http://chess-rest-test:8080" } ]
    chess-game-test-svc:
      loadBalancer:
        servers: [ { url: "http://chess-game-test:80" } ]
    chess-front-test-svc:
      loadBalancer:
        servers: [ { url: "http://chess-front-test:80" } ]
    hacman-test-svc:
      loadBalancer:
        servers: [ { url: "http://hacman-rest-test:8080" } ]
    hacman-front-test-svc:
      loadBalancer:
        servers: [ { url: "http://hacman-front-test:8080" } ]
    hacman-game-test-svc:
      loadBalancer:
        servers: [ { url: "http://hacman-game-test:80" } ]
    robak-test-svc:
      loadBalancer:
        servers: [ { url: "http://robak-rest-test:8080" } ]
    robak-game-test-svc:
      loadBalancer:
        servers: [ { url: "http://robak-game-test:80" } ]
    robak-front-test-svc:
      loadBalancer:
        servers: [ { url: "http://robak-front-test:80" } ]
    racer-test-svc:
      loadBalancer:
        servers: [ { url: "http://racer-rest-test:8080" } ]
    racer-front-test-svc:
      loadBalancer:
        servers: [ { url: "http://racer-front-test:80" } ]
    racer-game-test-svc:
      loadBalancer:
        servers: [ { url: "http://racer-game-test:80" } ]
    element-test-svc:
      loadBalancer:
        servers: [ { url: "http://element-rest-test:8080" } ]
    element-front-test-svc:
      loadBalancer:
        servers: [ { url: "http://element-front-test:80" } ]
    element-game-test-svc:
      loadBalancer:
        servers: [ { url: "http://element-game-test:80" } ]
    element-editor-test-svc:
      loadBalancer:
        servers: [ { url: "http://element-editor-rest-test:8080" } ]
    element-editor-front-test-svc:
      loadBalancer:
        servers: [ { url: "http://element-editor-front-test:80" } ]
    hub-rest-test-svc:
      loadBalancer:
        servers: [ { url: "http://hub-rest-test:8000" } ]
    hub-front-test-svc:
      loadBalancer:
        servers: [ { url: "http://hub-front-test:80" } ]

    # Dev endpoints
    andromeda-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:8444" } ]
    nebula-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:8445" } ]
    nebula-front-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:5173" } ]
    hacman-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:8446" } ]
    hacman-front-dev-svc:
      loadBalancer:
        serversTransport: "dev-insecure"
        servers:
          - url: "https://host.docker.internal:7296"
    hacman-game-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:5175" } ]
    chess-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:8447" } ]
    chess-front-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:5177" } ]
    chess-game-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:5175" } ]
    robak-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:8448" } ]
    robak-front-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:5178" } ]
    robak-game-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:5176" } ]
    racer-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:8450" } ]
    racer-front-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:5179" } ]
    racer-game-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:5180" } ]
    # Element (M8): panel 5273, board 5373, API 8449 — see the element docs.
    element-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:8449" } ]
    element-front-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:5273" } ]
    element-game-dev-svc:
      loadBalancer:
        servers: [ { url: "http://host.docker.internal:5373" } ]

  middlewares:
    #    strip-traefik:
    #      stripPrefix:
    #        prefixes: ["/traefik"]
    strip-resources:
      stripPrefix:
        prefixes: [ "/resources" ]
    # One prefix, not two. `/hub/api` and `/hub/docs` both lose exactly `/hub`, which is
    # what the backend's root_path expects to have been removed.
    strip-hub:
      stripPrefix:
        prefixes: [ "/hub" ]
    strip-andromeda:
      stripPrefix:
        prefixes: [ "/andromeda" ]
    strip-andromeda-dev:
      stripPrefix:
        prefixes: [ "/dev/andromeda" ]
    strip-nebula:
      stripPrefix:
        prefixes: [ "/nebula" ]
    strip-nebula-dev:
      stripPrefix:
        prefixes: [ "/dev/nebula" ]
    strip-nebula-front-dev:
      stripPrefix:
        prefixes: [ "/dev/nebula/app/" ]
    strip-chess:
      stripPrefix:
        prefixes: [ "/chess" ]
    strip-chess-dev:
      stripPrefix:
        prefixes: [ "/dev/chess" ]
    strip-chess-front-dev:
      stripPrefix:
        prefixes: [ "/dev/chess/app/" ]
